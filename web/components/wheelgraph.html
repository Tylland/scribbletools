<div class="flex flex-col">
    <div class="flex flex-row justify-between items-center mb-2">
        <label for="wheelCanvas" class="text-sm font-medium text-gray-900 dark:text-white">The Wheel</label>
            <div class="relative inline-block text-left">
            <div>
                <div data-component="dropdown-button"
                    class="inline-flex w-full justify-center text-sm font-medium text-gray-900 dark:text-white text-gray-900 cursor-pointer"
                    id="menu-button">
                    Download
                    <svg class="-mr-1 size-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"
                        data-slot="icon">
                        <path fill-rule="evenodd"
                            d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z"
                            clip-rule="evenodd" />
                    </svg>
                </div>
            </div>

            <div data-component="dropdown"
                class="absolute right-0 z-10 mt-2 w-30 origin-top-right rounded-md bg-gray-50 dark:bg-gray-600 shadow-lg ring-black/5 focus:outline-hidden hidden text-gray-700 dark:text-gray-300"
                role="menu" tabindex="-1">
                <div class="py-1">
                    <div data-component="downloadPNG" class="block px-4 py-2 text-sm  hover:text-gray-900 hover:bg-gray-100  dark:hover:text-white dark:hover:bg-gray-800 cursor-pointer">png</div>
                    <div data-component="downloadJPG" class="block px-4 py-2 text-sm  hover:text-gray-900 hover:bg-gray-100  dark:hover:text-white dark:hover:bg-gray-800 cursor-pointer">jpg</div>
                </div>
            </div>
        </div>

    </div>
    <!-- Canvas should be inside the <wheel-graph> component -->
    <canvas id="wheelCanvas" data-component="wheelCanvas"
        class="block p-2.5 w-full h-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
        width="622" height="622"></canvas>
</div>
